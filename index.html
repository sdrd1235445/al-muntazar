<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتظر الحقيقي - مواقيت الصلاة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 5px; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .time-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #0284c7;
        }
        .time-box h2 { margin: 0; color: #facc15; font-size: 32px; }
        .prayer-list { text-align: right; }
        .prayer-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: #334155;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>المنتظر الحقيقي</h1>
    <p class="subtitle">مواقيت الصلاة اليومية التلقائية</p>

    <div class="time-box">
        <span style="color: #94a3b8; font-size: 12px;">الوقت الحالي</span>
        <h2 id="clock">00:00:00</h2>
    </div>

    <div class="prayer-list" id="prayers">
        <div class="prayer-item"><span>الفجر</span><span id="fajr">--:--</span></div>
        <div class="prayer-item"><span>الشروق</span><span id="sunrise">--:--</span></div>
        <div class="prayer-item"><span>الظهر</span><span id="dhuhr">--:--</span></div>
        <div class="prayer-item"><span>العصر</span><span id="asr">--:--</span></div>
        <div class="prayer-item"><span>المغرب</span><span id="maghrib">--:--</span></div>
        <div class="prayer-item"><span>العشاء</span><span id="isha">--:--</span></div>
    </div>
</div>

<script>
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('ar-IQ');
    }
    setInterval(updateClock, 1000);
    updateClock();

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lng}&method=0`)
                .then(res => res.json())
                .then(data => {
                    const t = data.data.timings;
                    document.getElementById('fajr').innerText = t.Fajr;
                    document.getElementById('sunrise').innerText = t.Sunrise;
                    document.getElementById('dhuhr').innerText = t.Dhuhr;
                    document.getElementById('asr').innerText = t.Asr;
                    document.getElementById('maghrib').innerText = t.Maghrib;
                    document.getElementById('isha').innerText = t.Isha;
                });
        });
    }
</script>

</body>
</html>
